name: Quant projects CI

on:
  push:
    paths:
      - 'quant-projects/**'
      - '.github/workflows/quant-projects.yml'
  pull_request:
    paths:
      - 'quant-projects/**'
      - '.github/workflows/quant-projects.yml'
  workflow_dispatch:

jobs:
  quant-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant-projects/requirements.txt
      - name: Install requirements
        run: python -m pip install -r quant-projects/requirements.txt
      - name: Validate Monte Carlo, optimization, and backtest fixture
        run: |
          python -m pytest -q quant-projects/01-single-stock-monte-carlo/test_stock_monte_carlo.py
          python -m pytest -q quant-projects/03-five-stock-optimization/test_lab.py
          python -m pytest -q quant-projects/04-historical-backtesting/test_backtest.py
          python -m pytest -q quant-projects/06-tail-risk-bootstrap/test_dependence_diagnostics.py
          python -m pytest -q quant-projects/05-regime-stress-stability/test_stress_lab.py
          python -m pytest -q quant-projects/05-regime-stress-stability/test_risk_calibration.py
      - name: Validate Project 06 tail-risk fixture
        run: python -m pytest -q quant-projects/06-tail-risk-bootstrap/test_tail_risk.py
      - name: Validate Project 07 horizon alignment
        run: python -m pytest -q quant-projects/07-multi-horizon-risk/test_multi_horizon.py
      - name: Validate Project 07 dependent bootstrap and integrated scoring
        run: |
          python -m pytest -q quant-projects/07-multi-horizon-risk/test_dependent_bootstrap.py
          python -m pytest -q quant-projects/07-multi-horizon-risk/test_bootstrap_walkforward.py
      - name: Validate Project 08 portfolio risk attribution and covariance stability
        run: |
          python -m pytest -q quant-projects/08-risk-attribution/test_risk_attribution.py
          python -m pytest -q quant-projects/08-risk-attribution/test_stability.py
          python -m pytest -q quant-projects/08-risk-attribution/test_oos_covariance.py
      - name: Validate Project 09 drawdown and recovery
        run: |
          python -m pytest -q quant-projects/09-drawdown-recovery/test_drawdown.py
          python -m pytest -q quant-projects/09-drawdown-recovery/test_walkforward.py
      - name: Validate Project 10 liquidity capacity
        run: |
          python -m pytest -q quant-projects/10-liquidity-rebalancing/test_liquidity.py
          python -m pytest -q quant-projects/10-liquidity-rebalancing/test_adv_walkforward.py
          python -m pytest -q quant-projects/10-liquidity-rebalancing/test_calibration.py
      - name: Validate Project 11 rolling factor exposure stability
        run: |
          python -m pytest -q quant-projects/11-factor-exposure-stability/test_factor_lab.py
          python -m pytest -q quant-projects/11-factor-exposure-stability/test_beta_diagnostics.py
      - name: Validate Project 12 lagged volatility targeting
        run: python -m pytest -q quant-projects/12-volatility-targeting/test_volatility_targeting.py
      - name: Run two-stock Monte Carlo end-to-end
        run: python quant-projects/02-two-stock-correlation/two_stock_monte_carlo.py
