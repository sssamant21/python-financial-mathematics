name: Quant projects CI

on:
  push:
    paths:
      - 'quant-projects/**'
      - '.github/workflows/quant-projects.yml'
  pull_request:
    paths:
      - 'quant-projects/**'
      - '.github/workflows/quant-projects.yml'
  workflow_dispatch:

jobs:
  quant-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant-projects/requirements.txt
      - name: Install requirements
        run: python -m pip install -r quant-projects/requirements.txt
      - name: Validate Monte Carlo, optimization, and backtest fixture
        run: |
          python -m pytest -q quant-projects/01-single-stock-monte-carlo/test_stock_monte_carlo.py
          python -m pytest -q quant-projects/03-five-stock-optimization/test_lab.py
          python -m pytest -q quant-projects/04-historical-backtesting/test_backtest.py
          python -m pytest -q quant-projects/06-tail-risk-bootstrap/test_dependence_diagnostics.py
          python -m pytest -q quant-projects/05-regime-stress-stability/test_stress_lab.py
          python -m pytest -q quant-projects/05-regime-stress-stability/test_risk_calibration.py
      - name: Validate Project 06 tail-risk fixture
        run: python -m pytest -q quant-projects/06-tail-risk-bootstrap/test_tail_risk.py
      - name: Validate Project 07 horizon alignment
        run: python -m pytest -q quant-projects/07-multi-horizon-risk/test_multi_horizon.py
      - name: Validate Project 07 dependent bootstrap and integrated scoring
        run: |
          python -m pytest -q quant-projects/07-multi-horizon-risk/test_dependent_bootstrap.py
          python -m pytest -q quant-projects/07-multi-horizon-risk/test_bootstrap_walkforward.py
      - name: Validate Project 08 portfolio risk attribution and covariance stability
        run: |
          python -m pytest -q quant-projects/08-risk-attribution/test_risk_attribution.py
          python -m pytest -q quant-projects/08-risk-attribution/test_stability.py
          python -m pytest -q quant-projects/08-risk-attribution/test_oos_covariance.py
      - name: Validate Project 09 drawdown and recovery
        run: |
          python -m pytest -q quant-projects/09-drawdown-recovery/test_drawdown.py
          python -m pytest -q quant-projects/09-drawdown-recovery/test_walkforward.py
      - name: Validate Project 10 liquidity capacity
        run: |
          python -m pytest -q quant-projects/10-liquidity-rebalancing/test_liquidity.py
          python -m pytest -q quant-projects/10-liquidity-rebalancing/test_adv_walkforward.py
          python -m pytest -q quant-projects/10-liquidity-rebalancing/test_calibration.py
      - name: Validate Project 11 rolling factor exposure stability
        run: |
          python -m pytest -q quant-projects/11-factor-exposure-stability/test_factor_lab.py
          python -m pytest -q quant-projects/11-factor-exposure-stability/test_beta_diagnostics.py
      - name: Validate Project 12 lagged volatility targeting
        run: |
          python -m pytest -q quant-projects/12-volatility-targeting/test_volatility_targeting.py
          python -m pytest -q quant-projects/12-volatility-targeting/test_calibration_walkforward.py
      - name: Validate Project 13 inverse-volatility allocation
        run: |
          python -m pytest -q quant-projects/13-risk-parity/test_risk_parity.py
          python -m pytest -q quant-projects/13-risk-parity/test_erc.py
          python -m pytest -q quant-projects/13-risk-parity/test_compare.py
      - name: Validate Project 14 hedge-ratio stability
        run: |
          python -m pytest -q quant-projects/14-hedge-ratio-stability/test_hedge_lab.py
          python -m pytest -q quant-projects/14-hedge-ratio-stability/test_sensitivity.py
          python -m pytest -q quant-projects/14-hedge-ratio-stability/test_regime_uncertainty.py
      - name: Validate Project 15 bond duration and convexity
        run: |
          python -m pytest -q quant-projects/15-bond-duration-convexity/test_bond_lab.py
          python -m pytest -q quant-projects/15-bond-duration-convexity/test_curve_portfolio.py
          python -m pytest -q quant-projects/15-bond-duration-convexity/test_interpolation_stability.py
          python -m pytest -q quant-projects/15-bond-duration-convexity/test_forward_diagnostics.py
      - name: Validate Project 16 European option payoff and theoretical pricing
        run: |
          cd quant-projects/16-option-payoff-stress
          python -m unittest -v test_option_payoff.py test_black_scholes.py test_sensitivity.py test_stability_diagnostics.py
      - name: Validate Project 17 implied-volatility inversion
        run: |
          cd quant-projects/17-implied-volatility-validation
          python -m unittest -v test_implied_vol.py test_quote_validation.py test_surface_checks.py
      - name: Validate Project 18 credit expected loss and concentration
        run: |
          cd quant-projects/18-credit-loss-concentration
          python -m unittest -v test_credit_risk.py test_correlated_defaults.py test_correlation_sensitivity.py test_tail_attribution.py
      - name: Validate Project 19 liability cash-flow matching
        run: |
          cd quant-projects/19-liability-cashflow-matching
          python -m unittest -v test_cashflow_matching.py test_constrained_matching.py test_maturity_diagnostics.py
          python -m compileall -q cashflow_matching.py constrained_matching.py test_cashflow_matching.py test_constrained_matching.py maturity_diagnostics.py test_maturity_diagnostics.py
      - name: Validate Project 20 retirement sequence risk
        run: |
          cd quant-projects/20-retirement-sequence-risk
          python -m unittest -v test_sequence_risk.py test_withdrawal_sensitivity.py
          python -m compileall -q sequence_risk.py withdrawal_sensitivity.py test_sequence_risk.py test_withdrawal_sensitivity.py
      - name: Validate Project 21 single-period sector attribution
        run: |
          cd quant-projects/21-sector-performance-attribution
          python -m unittest -v test_attribution.py test_linked_attribution.py
          python -m compileall -q attribution.py linked_attribution.py test_attribution.py test_linked_attribution.py
          python attribution.py
          python linked_attribution.py
      - name: Validate Project 22 tracking error and information ratio
        run: |
          cd quant-projects/22-tracking-error-information-ratio
          python -m unittest -v test_tracking_error.py test_sensitivity.py
          python -m compileall -q tracking_error.py test_tracking_error.py sensitivity.py test_sensitivity.py
          python tracking_error.py
          python sensitivity.py
      - name: Run two-stock Monte Carlo end-to-end
        run: python quant-projects/02-two-stock-correlation/two_stock_monte_carlo.py

      - name: Validate Project 23 downside risk ratios
        run: |
          cd quant-projects/23-downside-risk-ratios
          python -m unittest -v test_downside_risk.py
          python -m compileall -q downside_risk.py test_downside_risk.py
          python downside_risk.py

      - name: Validate Project 24 portfolio concentration
        run: |
          cd quant-projects/24-portfolio-concentration
          python -m unittest -v test_concentration.py
          python -m compileall -q concentration.py test_concentration.py
          python concentration.py
          python -m unittest -v test_rebalancing.py
          python -m compileall -q rebalancing.py test_rebalancing.py
          python rebalancing.py

      - name: Validate Project 25 high-water-mark fee accounting
        run: |
          cd quant-projects/25-high-water-mark-fees
          python -m unittest -v test_fee_lab.py
          python -m compileall -q fee_lab.py test_fee_lab.py
          python fee_lab.py
          python -m unittest -v test_crystallization.py
          python -m compileall -q crystallization.py test_crystallization.py
          python crystallization.py

      - name: Validate Project 26 cash-flow performance
        run: |
          cd quant-projects/26-cashflow-performance
          python -m unittest -v test_performance.py
          python -m compileall -q performance.py test_performance.py
          python performance.py
          python -m unittest -v test_dated_xirr.py
          python -m compileall -q dated_xirr.py test_dated_xirr.py
          python dated_xirr.py

      - name: Validate Project 27 Kelly estimation risk
        run: |
          cd quant-projects/27-kelly-estimation-risk
          python -m unittest -v test_kelly.py
          python -m compileall -q kelly.py test_kelly.py
          python kelly.py
          python -m unittest -v test_uncertainty.py
          python -m compileall -q uncertainty.py test_uncertainty.py
          python uncertainty.py --wins 55 --trials 100
